# Preset: Universitas Jember - Fakultas Pertanian (UNEJ FAPERTA)
# Mengacu pada Buku Pedoman Penulisan Karya Tulis Ilmiah (PPKI) FAPERTA UNEJ
# SK Dekan No. 5705/UN25.1.3/KP.8/2021.
preset_id: "unej-faperta"
name: "Universitas Jember - Fakultas Pertanian"
description: "Format penulisan karya tulis ilmiah S1 FAPERTA UNEJ (margin 4-3-4-3, Times New Roman 12pt, BAB angka Arab)."

# 1. Geometri & Margin Halaman (pias atas 4cm, bawah 3cm, kiri 4cm, kanan 3cm)
margin_top: 4cm
margin_bottom: 3cm
margin_left: 4cm
margin_right: 3cm

# 2. Tipografi & Spasi
font_family: "Times New Roman"
font_fallback: "Libertinus Serif"
font_size: 12pt
line_spacing: 1.5
first_line_indent: 1cm

# 3. Penomoran Heading
#    Bab: "BAB 1. PENDAHULUAN" (arabic) atau "BAB I PENDAHULUAN" (roman)
heading_chapter_prefix: "BAB "
heading_chapter_num_format: "arabic"
heading_chapter_dot: true
#    Subbab: "1.1. Judul Subbab" (bold, diakhiri titik)
heading_sub_dot: true
#    Subsubbab: "1.1.1 Judul Subsubbab" (tidak bold, tanpa titik)
heading_subsub_dot: false
heading_subsub_bold: false

# 4. Nomor Halaman
#    Front matter: angka Romawi kecil, bawah tengah
#    Batang tubuh: angka Arab, kanan atas (halaman pertama bab: bawah tengah)
page_number_front: "i"
page_number_front_position: "bottom-center"
page_number_body_position: "top-right"
page_number_chapter_first_position: "bottom-center"

# 5. Pengaturan Sampul
cover_show_lecturer: true
cover_logo_width: 3cm

# 6. Sitasi
citation_style: "apa-6th"
